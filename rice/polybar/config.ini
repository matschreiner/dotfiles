[colors]
background = #282828
background-alt = #3c3836
foreground = #ebdbb2
primary = #fabd2f
secondary = #83a598
alert = #fb4934
disabled = #928374

[bar/main]
width = 100%
height = 26
radius = 0
fixed-center = true
background = ${colors.background}
foreground = ${colors.foreground}
border-size = 0
padding-left = 2
padding-right = 2
module-margin = 2
font-0 = JetBrainsMono Nerd Font:size=10;2

modules-left = i3 monitor_name launcher separator memory
modules-center = date
modules-right = pulseaudio separator cpu separator battery tray

cursor-click = pointer
cursor-scroll = ns-resize

monitor = ${env:MONITOR:}
monitor-strict = true
pin-workspaces = true

[module/monitor_name]
type = custom/text
format = ${env:MONITOR:}
label-foreground = ${colors.primary}

; [module/i3]
; type = internal/i3
; format = <label-state> <label-mode>
; label-focused = %index%
; label-focused-background = ${colors.secondary}
; label-focused-foreground = ${colors.background}
; label-focused-padding = 2
; label-unfocused = %index%
; label-unfocused-foreground = ${colors.disabled}
; label-unfocused-padding = 2
; label-visible = %index%
; label-visible-foreground = ${colors.secondary}
; label-visible-padding = 2
; label-urgent = %index%
; label-urgent-background = ${colors.alert}
; label-urgent-foreground = ${colors.background}
; label-urgent-padding = 2
; sort = true


[module/date]
type = internal/date
interval = 60
date = %a %d %b %H:%M
label = %date%
label-foreground = ${colors.primary}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume =  %percentage%%
label-muted =  mute
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 5
format-prefix = " "
format-prefix-foreground = ${colors.secondary}
label = %percentage_used%%

[module/cpu]
type = internal/cpu
interval = 5
format-prefix = " "
format-prefix-foreground = ${colors.secondary}
label = %percentage%%

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
format-charging =   <label-charging>
format-discharging =   <label-discharging>
format-full =   full
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
label-charging-foreground = ${colors.primary}
label-discharging-foreground = ${colors.secondary}
label-full-foreground = ${colors.primary}

[module/launcher]
type = custom/text
format = ""
format-foreground = ${colors.primary}
click-left = rofi -show drun

[module/separator]
type = custom/text
format = ""
format-foreground = #665c54
format-background = ${colors.background}

[module/tray]
type = internal/tray
tray-spacing = 8
tray-background = ${colors.background}
tray-position = right
tray-detached = false

