#################################
#             Shadows
#################################

shadow = true;
shadow-radius = 18;
shadow-opacity = 0.45;
shadow-offset-x = -18;
shadow-offset-y = -18;
shadow-exclude = [
  "class_g = 'i3-frame'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#           Fading
#################################

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 4;

#################################
#   Transparency / Opacity
#################################

inactive-opacity = 0.88;
frame-opacity = 1.0;
inactive-opacity-override = true;

opacity-rule = [
  "90:class_g = 'Polybar'",
  "92:class_g = 'Rofi'"
];

#################################
#             Corners
#################################

corner-radius = 10;
rounded-corners-exclude = [
  "class_g = 'Polybar'"
];

#################################
#             Blur
#################################

blur-method = "dual_kawase";
blur-strength = 7;
blur-background = true;
blur-background-fixed = true;
blur-kern = "3x3box";

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#################################
#   General Settings
#################################

backend = "glx";
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

wintypes:
{
  dock = { shadow = false; blur-background = false; }
  desktop = { shadow = false; blur-background = false; }
  popup_menu = { opacity = 0.92; }
  dropdown_menu = { opacity = 0.92; }
};
